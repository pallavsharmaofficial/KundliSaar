name: kundlisaar
description: "KundliSaar - a free Vedic kundli app that computes everything on your device, in Hindi and English."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  go_router: ^16.2.1
  intl: any
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.0
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
    - family: Tiro
      fonts:
        - asset: assets/fonts/TiroDevanagariHindi-Regular.ttf
    - family: Yatra
      fonts:
        - asset: assets/fonts/YatraOne-Regular.ttf
