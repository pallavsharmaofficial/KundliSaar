name: kundlisaar
description: "KundliSaar - a free Vedic kundli app that computes everything on your device, in Hindi and English."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  go_router: ^16.2.1
  intl: any
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.0
  provider: ^6.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# The icon is the North Indian kundli itself, drawn by
# tools/branding/make_icon.py rather than exported from a design file.
flutter_launcher_icons:
  image_path: assets/branding/icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#E3A008"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  adaptive_icon_monochrome: assets/branding/icon-monochrome.png
  web:
    generate: true
    image_path: assets/branding/icon-1024.png
    background_color: "#FDF6E8"
    theme_color: "#6B1D1D"

flutter_native_splash:
  color: "#FDF6E8"
  color_dark: "#14183A"
  image: assets/branding/splash-light.png
  image_dark: assets/branding/splash-dark.png
  android_12:
    image: assets/branding/splash-light.png
    icon_background_color: "#FDF6E8"
    image_dark: assets/branding/splash-dark.png
    icon_background_color_dark: "#14183A"
  web: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/branding/
  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
    - family: Tiro
      fonts:
        - asset: assets/fonts/TiroDevanagariHindi-Regular.ttf
    - family: Yatra
      fonts:
        - asset: assets/fonts/YatraOne-Regular.ttf
