name: Analyze and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        # The engine tests hold the ephemeris to about an arc-second against
        # JPL DE440s fixtures, so an accuracy regression fails the build.
        run: flutter test
