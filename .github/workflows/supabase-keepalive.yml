name: Supabase keep-alive

# Supabase pauses a free project after a week without requests. A quiet week
# between flyer runs should not take the landing page down, so this asks the
# project's auth service for its health once a day. It uses only the public
# URL and anon key from site/config.js, and does nothing until they are set.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(sed -n 's/.*supabaseUrl: "\([^"]*\)".*/\1/p' site/config.js)
          KEY=$(sed -n 's/.*supabaseAnonKey: "\([^"]*\)".*/\1/p' site/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::Backend not connected yet; nothing to ping."
            exit 0
          fi
          curl -fsS -o /dev/null -w "auth health: %{http_code}\n" -H "apikey: $KEY" "$URL/auth/v1/health"
