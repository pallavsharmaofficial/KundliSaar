name: Deploy the funnel backend to Supabase

# Applies supabase/migrations to the project's database and deploys the edge
# functions. Until the owner has created a Supabase project and added the
# secrets (docs/funnel/BACKEND_SETUP.md), the deploy job is skipped and the
# run stays green.

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two migrations racing on one database would be bad; let a run finish.
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  check:
    # Secrets cannot be read in a job-level `if`, so this job looks and says.
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.look.outputs.configured }}
    steps:
      - id: look
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; skipping the Supabase deploy."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the validation tests
        # The same rules the functions use; cheap, and a broken rule should
        # not reach the live endpoint.
        run: node --experimental-strip-types --test supabase/tests/lead_test.mjs

      - name: Link the project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Set function secrets
        # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are provided to every
        # function by Supabase itself; only the CORS list is ours.
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          if [ -n "$ALLOWED_ORIGINS" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
          else
            echo "::notice::Repository variable ALLOWED_ORIGINS is not set; the functions accept any origin."
          fi

      - name: Deploy edge functions
        # One at a time, so a CLI that takes a single name still works. The
        # runner has Docker for local bundling; --use-api (bundling on
        # Supabase's side) is tried only if that fails.
        run: |
          for f in submit-lead track manage-staff; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" \
              || supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
          done
