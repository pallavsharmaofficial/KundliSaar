name: Deploy website and web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build web app
        # The app lives at /<repo>/app/ under the landing site.
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/app/"

      - name: Assemble site
        run: |
          rm -rf dist
          mkdir -p dist/app
          cp -R site/. dist/
          cp -R build/web/. dist/app/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
