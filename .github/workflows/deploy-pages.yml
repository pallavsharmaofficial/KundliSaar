name: Deploy website and web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deployment at a time, but a run already publishing is allowed to
  # finish: cancelling it leaves the site on the previous version and marks
  # the run failed, which is what happened on 5 October.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build web app
        # The app lives at /<repo>/app/ under the landing site.
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/app/"

      - name: Generate the Learn pages and the panchang
        # Built from the engine on every deploy, so a change to the engine
        # reaches the site without anyone remembering to regenerate. The
        # panchang takes today's date in IST, which is why the daily-panchang
        # workflow exists: it asks for this deploy once a day.
        run: |
          dart run tools/site/build_pages.dart
          dart run tools/site/build_panchang.dart

      - name: Assemble site
        run: |
          rm -rf dist
          mkdir -p dist/app
          cp -R site/. dist/
          cp -R build/web/. dist/app/
          touch dist/.nojekyll

      - name: Build the "accha samay" landing page's engine
        # The app's own Dart engine, compiled to JavaScript, so the landing
        # page computes the kundli and the PDF without the whole Flutter app.
        run: |
          dart compile js -O2 tools/funnel/funnel_main.dart -o dist/samay/funnel.js
          rm -f dist/samay/funnel.js.deps dist/samay/funnel.js.map
          mkdir -p dist/samay/fonts
          cp assets/fonts/Mukta-Regular.ttf assets/fonts/Mukta-SemiBold.ttf \
             assets/fonts/TiroDevanagariHindi-Regular.ttf assets/fonts/YatraOne-Regular.ttf \
             dist/samay/fonts/
          cp assets/data/places.json dist/samay/places.json

      - name: Write the public config
        # Normally site/config.js, written by the Supabase setup workflow, is
        # used as it is. Repository variables, when set, take its place.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          if not os.environ.get("SUPABASE_URL"):
              print("Using site/config.js as committed.")
              sys.exit(0)
          cfg = {
              "supabaseUrl": os.environ.get("SUPABASE_URL", ""),
              "supabaseAnonKey": os.environ.get("SUPABASE_ANON_KEY", ""),
              "baseUrl": os.environ.get("PUBLIC_BASE_URL") or "https://pallavsharmaofficial.github.io/KundliSaar",
              "contactPhone": "9910144125",
              "whatsappPhone": "919910144125",
              "upiId": "pallavsharma353-1@okaxis",
              "upiName": "Pallav Sharma",
              "passwordPrice": 199,
          }
          open("dist/config.js", "w").write("window.KS_CONFIG = " + json.dumps(cfg, indent=2) + ";\n")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
