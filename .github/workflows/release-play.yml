name: Release to Google Play

# Run it by hand from the Actions tab, choosing the track, or let a v* tag
# push an internal build. The first upload of a brand new app has to be made
# in the Play Console by hand; Google's API refuses to publish to an app that
# has never had a release. After that this workflow does every update.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: Release status
        type: choice
        default: completed
        options: [completed, draft, inProgress]
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          PROPS

      - name: Build the app bundle
        run: flutter build appbundle --release

      - name: Keep the bundle, whatever happens next
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # The secrets context cannot be read in an `if`, so the presence of the
      # service account is turned into an env flag first.
      - name: Check for a Play service account
        env:
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "HAS_SERVICE_ACCOUNT=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SERVICE_ACCOUNT=false" >> "$GITHUB_ENV"
          fi

      - name: Upload to Play
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.pallavsharma.kundlisaar
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          whatsNewDirectory: store/whatsnew

      - name: Say what to do when no service account is set yet
        if: env.HAS_SERVICE_ACCOUNT == 'false'
        run: |
          echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, so nothing was uploaded."
          echo "::notice::Download the app-release-aab artifact above and upload it in the Play Console by hand."
